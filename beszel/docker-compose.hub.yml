# Beszel Hub — הדשבורד המרכזי
# ---------------------------
# מריצים על שרת אחד בלבד (אפשר על אחד מ-3 השרתים הקיימים).
# הפעלה:  docker compose -f docker-compose.hub.yml up -d
# גישה:   http://<IP-של-השרת>:8090   (וגם מהאייפון דרך Safari / PWA)

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      # socket משותף — מאפשר לרוץ גם agent על אותו שרת (ראה README)
      - ./beszel_socket:/beszel_socket

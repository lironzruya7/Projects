# התראות מותאמות אישית ל-Netdata
# --------------------------------
# להעתיק לכל שרת אל: /etc/netdata/health.d/custom.conf
# ואז להריץ: netdatacli reload-health   (או: systemctl restart netdata)
#
# ההתראות נשלחות אוטומטית ל-Netdata Cloud ומשם כ-push לאפליקציה באייפון
# (צריך להפעיל Notifications באפליקציה: Profile -> Notifications).

# --- מעבד (CPU) ---
   template: cpu_usage_high
         on: system.cpu
      lookup: average -3m unaligned of user,system,softirq,irq,guest
      units: %
      every: 1m
       warn: $this > 85
       crit: $this > 95
      delay: down 5m multiplier 1.5 max 1h
       info: שימוש CPU ממוצע גבוה ב-3 הדקות האחרונות
         to: sysadmin

# --- זיכרון (RAM) ---
   template: ram_usage_high
         on: system.ram
      calc: ($used + $buffers + $cached - $available) * 100 / ($used + $free + $buffers + $cached)
      units: %
      every: 1m
       warn: $this > 85
       crit: $this > 95
      delay: down 5m multiplier 1.5 max 1h
       info: שימוש RAM גבוה
         to: sysadmin

# --- דיסק (root filesystem) ---
   template: disk_space_low
         on: disk_space./
      calc: $used * 100 / ($avail + $used)
      units: %
      every: 1m
       warn: $this > 80
       crit: $this > 90
      delay: down 15m multiplier 1.5 max 1h
       info: מעט מקום פנוי בדיסק (/)
         to: sysadmin
